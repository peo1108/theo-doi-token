name: iOS smoke (Simulator)

# Chạy tay (hoặc khi sửa chính file này): build cho Simulator, dựng hub + server giả (remote.js + claude giả), mở các màn hình và chụp ảnh.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-smoke.yml"
      - "ios/tools/smoke-server.js"

jobs:
  smoke:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project CCRemote.xcodeproj -scheme CCRemote -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim-build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" sim-build.log

      - name: Start fake server
        run: |
          (cd hub && npm ci --omit=dev --no-audit --no-fund)
          node ios/tools/smoke-server.js "$RUNNER_TEMP/smoke" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do test -f "$RUNNER_TEMP/smoke/smoke.json" && break; sleep 1; done
          cat "$RUNNER_TEMP/server.log"
          test -f "$RUNNER_TEMP/smoke/smoke.json"

      - name: Boot simulator & install
        run: |
          set -euo pipefail
          RUNTIME="$(xcrun simctl list runtimes | awk -F ' - ' '/^iOS/ {print $NF}' | tail -n 1)"
          TYPE="$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone 1[6-9] Pro \(/ {print $2}' | tail -n 1)"
          if [ -z "$TYPE" ]; then TYPE="$(xcrun simctl list devicetypes | awk -F '[()]' '/iPhone/ {print $2}' | tail -n 1)"; fi
          UDID="$(xcrun simctl create smoke "$TYPE" "$RUNTIME")"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          APP="$(find ios/build/sim/Build/Products -name 'CCRemote.app' -type d | head -n 1)"
          xcrun simctl install "$UDID" "$APP"

      - name: Screenshots
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/smoke/smoke.json"
          j() { node -e "console.log(require('$S').$1)"; }
          mkdir -p shots
          shot() { sleep "$2"; xcrun simctl io "$UDID" screenshot "shots/$1.png"; }
          open_s() { xcrun simctl terminate "$UDID" vn.peo.ccremote || true; xcrun simctl launch "$UDID" vn.peo.ccremote -openSession "$(j $1)"; }

          # chưa đăng nhập -> màn đăng nhập hub
          xcrun simctl launch "$UDID" vn.peo.ccremote
          shot 01-login 4
          xcrun simctl terminate "$UDID" vn.peo.ccremote

          # nạp sẵn đăng nhập hub (SecureStore rơi về UserDefaults khi Keychain trống) + máy đã chọn
          xcrun simctl spawn "$UDID" defaults write vn.peo.ccremote hubURL "$(j hubURL)"
          xcrun simctl spawn "$UDID" defaults write vn.peo.ccremote secure.hubToken "$(j hubToken)"
          xcrun simctl spawn "$UDID" defaults write vn.peo.ccremote machineId "$(j machineId)"
          # tắt thông báo trong app: không hiện hộp xin quyền (không ai bấm) che mọi ảnh chụp
          xcrun simctl spawn "$UDID" defaults write vn.peo.ccremote notifyOn -bool NO
          xcrun simctl launch "$UDID" vn.peo.ccremote
          shot 02-home 6

          open_s chat
          shot 03-chat 5
          open_s perm
          shot 04-permission 5
          touch "$RUNNER_TEMP/smoke/allow-perm"   # server giả duyệt quyền
          shot 05-permission-done 3
          open_s ask
          shot 06-question 5
          open_s limit
          shot 07-limit 5
          xcrun simctl ui "$UDID" appearance dark
          open_s chat
          shot 08-chat-dark 5
          xcrun simctl terminate "$UDID" vn.peo.ccremote
          xcrun simctl launch "$UDID" vn.peo.ccremote
          shot 09-home-dark 6
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" vn.peo.ccremote || true
          xcrun simctl launch "$UDID" vn.peo.ccremote -openSession "$(j chat)" -openSettings YES
          shot 10-session-settings 6
          xcrun simctl terminate "$UDID" vn.peo.ccremote || true
          xcrun simctl launch "$UDID" vn.peo.ccremote -openSession "$(j chat)" -draft "/co"
          shot 11-commands 6
          open_s ide
          shot 12-vscode 5
          xcrun simctl ui "$UDID" appearance dark
          open_s ide
          shot 13-vscode-dark 5
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" vn.peo.ccremote || true
          xcrun simctl launch "$UDID" vn.peo.ccremote
          shot 14-home-projects 6
          xcrun simctl terminate "$UDID" vn.peo.ccremote || true
          xcrun simctl launch "$UDID" vn.peo.ccremote -openProject "$(j work)"
          shot 15-project 6
          open_s ponder
          shot 16-thinking 5
          cat "$RUNNER_TEMP/server.log"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: |
            shots/
            ios/sim-build.log
          if-no-files-found: warn
